# project metadata and dependencies
[project]
# python version
requires-python = ">=3.14,<4.0.0"
# project metadata
name = "openmarkets-api"
version = "0.1.0"
description = ""
readme = "README.md"
keywords = []
classifiers = []
authors = [{ name = "Abdelrahman Abdelkhalek", email = "hey@abdosworld.com" }]
maintainers = [
    { name = "Abdelrahman Abdelkhalek", email = "hey@abdosworld.com" },
]
# project dependencies
dependencies = [
    "alembic>=1.20.0,<2.0.0",
    "asyncpg>=0.31.0,<1.0.0",
    "fastapi>=0.141.1,<1.0.0",
    "httptools>=0.8.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "openmarkets>=0.1.0,<1.0.0",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "redis[hiredis]>=8.1.0,<9.0.0",
    "sentry-sdk>=2.70.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.54,<3.0.0",
    "starlette>=1.7.0,<2.0.0",
    "uvicorn>=0.53.0,<1.0.0",
    "uvloop>=0.22.1,<1.0.0",
]

# dependency groups
[dependency-groups]
# dev
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "fakeredis>=2.26.0,<3.0.0",
    "ruff>=0.16.8,<1.0.0",
    "watchfiles>=1.0.0,<2.0.0",
]

# dependency sources
[tool.uv.sources]
openmarkets = { git = "https://github.com/abdelrahman0w/openmarkets-sdk", branch = "master" }

# project urls
[project.urls]
"Homepage" = "https://github.com/abdelrahman0w/openmarkets-api"
"Source Code" = "https://github.com/abdelrahman0w/openmarkets-api"
"Documentation" = "https://github.com/abdelrahman0w/openmarkets-api#readme"
