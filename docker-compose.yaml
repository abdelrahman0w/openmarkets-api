services:
  openmarkets-api:
    image: openmarkets-api:local
    container_name: openmarkets-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
      secrets:
        - gh_token
    environment:
      - DATABASE_HOST=openmarkets-db
      - DATABASE_PORT=5432
      - DATABASE_USER=openmarkets
      - DATABASE_PASSWORD=openmarkets
      - DATABASE_NAME=openmarkets
      - REDIS_HOST=openmarkets-redis
      - APP_LOG_JSON=false
      - APP_PORT=${APP_PORT:-8080}
    volumes:
      - .:/app
    depends_on:
      openmarkets-db:
        condition: service_healthy
      openmarkets-redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    entrypoint: ["/app/bin/entrypoint.sh", "--dev"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, urllib.request; urllib.request.urlopen(f"http://127.0.0.1:{os.environ['APP_PORT']}/health/ready", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  openmarkets-db:
    image: postgres:18
    container_name: openmarkets-db
    environment:
      - POSTGRES_USER=openmarkets
      - POSTGRES_PASSWORD=openmarkets
      - POSTGRES_DB=openmarkets
    volumes:
      - openmarkets_postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "openmarkets",
          "-d",
          "openmarkets",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  openmarkets-redis:
    image: redis:8-alpine
    container_name: openmarkets-redis
    volumes:
      - openmarkets_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openmarkets_postgres_data:
  openmarkets_redis_data:

secrets:
  gh_token:
    environment: GH_TOKEN
